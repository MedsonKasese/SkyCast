<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCast | Modern Weather App</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    </head>

  <body>
    <header class="app-header">
      <h1>SkyCast</h1>
      <img class="units-icon" src="../assets/icons/icon-units.svg">
    </header>
    <main>
      <div class="container">
        <h1 class="welcome-msg">How's is the sky looking today?</h1>
        
        <!--SEARCH INPUT BOX-->
        <form class="weather-search-form" id="search-form">
          <div class="search-input-wrapper">
            <img class="search-icon" src="../assets/icons/icon-search.svg">
            <input 
               type="search" 
               id="search-box" 
               name="city" 
               placeholder="Search for a  place...">

          </div>
          
        
          <button type="submit" id="search-button">Search</button>
        
        </form>

        <p id="error-message"></p>
        
        <!--WEATHER CARD SECTION-->
      <section class="weather-card">
       <!--<img src="../assets/icons/bg-today-large.svg" alt="">-->
        <div class="weather-info">

          <div class="location-info">
            
              <h2 id="city-name">Mzuzu, Malawi</h2>
              <p>
                Sunday, 19 July 2026
              </p>
          </div>
            
          <div class="temperature-info">
            <div class="temparature-main">
              <img class="weather-icon" id="weather-icon" src="../assets/images/icon-sunny.webp" alt="Sunny">
              <p id="weather-condition">sunny</p>
              <h2 class="temperature" id="temperature">-</h2>
              
            </div>

              
            
          </div>

        </div>

      </section>
        
        <!--WEATHER DETAILS SECTION-->
      <section class="weather-details">
          <div class="detail-card">
            <div class="detail-header">
              <h3>Feels Like</h3>
              <p class="detail-value" id="feels-like">-</p>
            </div>
          </div>  

            <div class="detail-card">
              <div class="detail-header">
                <h3>Humidity</h3>
                <p class="detail-value" id="humidity">-</p>
            </div>
            </div>

              <div class="detail-card">
                <div class="detail-header">
                  <h3>Wind Speed</h3>
                  <p class="detail-value" id="wind-speed">-</p>
              </div>
              </div>

                <div class="detail-card">
                  <div class="detail-header">
                    <h3>Precipitation</h3>
                    <p class="detail-value" id="precipitation">-</p>
                </div>

            
          </div>
        </section>
   </div>

    </main>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/ui.js"></script>
  </body>
</html>
